<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YouTube Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .container { max-width: 760px; margin-top: 40px; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 12px; }
        .progress-bar-bg { background-color: #e9ecef; border-radius: 6px; height: 8px; overflow: hidden; }
        .progress-bar-fill {
            background: linear-gradient(90deg, #0d6efd, #0a58ca);
            height: 100%;
            width: 0%;
            transition: width 0.2s ease;
        }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; color: white; }
        .badge-pending { background-color: #6c757d; }
        .badge-downloading { background-color: #0d6efd; }
        .badge-done { background-color: #198754; }
        .badge-error { background-color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4">
        <h2 class="text-center mb-4">🎬 YouTube Downloader</h2>

        <div class="mb-4">
            <label class="form-label fw-bold">Ссылка на видео</label>
            <input type="text" id="url" class="form-control" placeholder="Вставьте ссылку на YouTube видео">
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-bold">Качество</label>
                <select id="resolution" class="form-select">
                    <option value="best">Лучшее качество (авто)</option>
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                </select>
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <button onclick="startDownload()" class="btn btn-primary w-100">Скачать</button>
            </div>
        </div>

        <!-- Статус и прогресс -->
        <div id="status-area" class="d-none">
            <h5 id="video-title" class="fw-bold"></h5>
            <div class="d-flex justify-content-between small text-muted mb-2">
                <span id="video-duration"></span>
                <span id="video-filesize"></span>
            </div>

            <div class="progress-bar-bg mb-3">
                <div id="progress-bar" class="progress-bar-fill"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <span id="progress-text" class="me-3"></span>
                <span id="status-badge" class="status-badge"></span>
            </div>

            <div id="download-link" class="mt-3 d-none">
                <a href="#" id="file-download" class="btn btn-success">📥 Скачать файл</a>
            </div>
        </div>
    </div>
</div>

<script>
    async function startDownload() {
        const url = document.getElementById('url').value.trim();
        const resolution = document.getElementById('resolution').value;
        const statusArea = document.getElementById('status-area');
        statusArea.classList.add('d-none');

        if (!url) {
            alert('Пожалуйста, вставьте ссылку на видео');
            return;
        }

        const res = await fetch('/download', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url, resolution})
        });
        const data = await res.json();

        if (data.error) {
            alert('Ошибка: ' + data.error);
            return;
        }

        const jobId = data.job_id;
        statusArea.classList.remove('d-none');
        document.getElementById('progress-text').textContent = 'Ожидание начала загрузки...';
        updateStatusBadge('pending');

        checkStatus(jobId, statusArea);
    }

    async function checkStatus(jobId, statusArea) {
        try {
            const res = await fetch(`/status/${jobId}`);
            const data = await res.json();
            if (!data || data.error) return;

            // Обновляем прогресс
            const pct = data.progress_pct || 0;
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('progress-text').textContent = data.progress_text || `${pct.toFixed(1)}%`;

            // Данные видео
            if (data.title) document.getElementById('video-title').textContent = data.title;
            if (data.duration) document.getElementById('video-duration').textContent = `Длительность: ${data.duration}`;
            if (data.filesize) document.getElementById('video-filesize').textContent = `Размер: ${data.filesize}`;

            // Статус
            updateStatusBadge(data.status);

            if (data.status === 'done') {
                const dlLink = document.getElementById('download-link');
                const fileLink = document.getElementById('file-download');
                dlLink.classList.remove('d-none');
                fileLink.href = `/download-file/${jobId}`;
            } else if (data.status === 'error') {
                document.getElementById('progress-text').textContent = data.error || 'Ошибка загрузки';
            } else {
                setTimeout(() => checkStatus(jobId, statusArea), 1500);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function updateStatusBadge(status) {
        const badge = document.getElementById('status-badge');
        badge.className = 'status-badge';
        if (status === 'pending') badge.classList.add('badge-pending');
        else if (status === 'downloading') badge.classList.add('badge-downloading');
        else if (status === 'done') badge.classList.add('badge-done');
        else if (status === 'error') badge.classList.add('badge-error');
        badge.textContent = status.toUpperCase();
    }
</script>
</body>
</html>
