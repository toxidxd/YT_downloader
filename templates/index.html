<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YouTube Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 15px; }
        .controls { margin-bottom: 20px; }
        input[type="text"] { width: 70%; padding: 8px; }
        button { padding: 8px 16px; cursor: pointer; }
        #status-area { margin-top: 20px; white-space: pre-wrap; }
        .status-pending { color: #666; }
        .status-downloading { color: #007bff; }
        .status-done { color: #28a745; }
        .status-error { color: #dc3545; }
    </style>
</head>
<body>
    <h1>Скачивание видео с YouTube</h1>
    <div class="controls">
        <input type="text" id="url" placeholder="Ссылка на YouTube видео">
        <select id="resolution">
            <option value="best">Лучшее качество</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
        </select>
        <button onclick="startDownload()">Скачать</button>
    </div>
    <div id="status-area"></div>

    <script>
        async function startDownload() {
            const url = document.getElementById('url').value.trim();
            const resolution = document.getElementById('resolution').value;
            const statusArea = document.getElementById('status-area');
            statusArea.textContent = 'Отправка запроса...';

            const res = await fetch('/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url, resolution})
            });
            const data = await res.json();

            if (data.error) {
                statusArea.textContent = 'Ошибка: ' + data.error;
                return;
            }

            const jobId = data.job_id;
            statusArea.innerHTML = `<b>Задача создана: ${jobId}</b><br>Статус: <span class="status-pending">ожидание</span><br>`;

            checkStatus(jobId, statusArea);
        }

        async function checkStatus(jobId, statusArea) {
            try {
                const res = await fetch(`/status/${jobId}`);
                const data = await res.json();
                const span = statusArea.querySelector('.status-' + data.status) || statusArea;
                span.textContent = `Статус: ${data.status}`;
                if (data.status === 'done') {
                    statusArea.innerHTML += `<br><a href="/download-file/${jobId}" download>Скачать файл</a>`;
                } else if (data.status === 'error') {
                    statusArea.innerHTML += `<br>Ошибка: ${data.error || 'Неизвестная ошибка'}`;
                } else {
                    setTimeout(() => checkStatus(jobId, statusArea), 2000);
                }
            } catch (e) {
                statusArea.innerHTML += `<br>Ошибка соединения`;
            }
        }
    </script>
</body>
</html>
